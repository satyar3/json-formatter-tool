<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description"
        content="A lightweight JSON Formatter and Validator tool. Format and validate your JSON easily in the browser.">
    <meta name="keywords" content="JSON, formatter, validator, developer tools, online tools">
    <meta name="author" content="Your Name">
    <meta property="og:title" content="JSON Formatter & Validator">
    <meta property="og:description" content="Format, validate, and beautify JSON online. Free and fast.">
    <meta property="og:type" content="website">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧹</text></svg>">
    <title>JSON Formatter & Validator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
        }

        #output {
            white-space: pre-wrap;
            background: #eef;
            padding: 10px;
            border: 1px solid #ccc;
            margin-top: 15px;
            font-family: monospace;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 14px;
        }

        .error {
            color: red;
        }

        body.dark {
            background-color: #121212;
            color: #f0f0f0;
        }

        body.dark textarea {
            background-color: #1e1e1e;
            color: #e6e6e6;
            border: 1px solid #333;
        }

        body.dark #output {
            background-color: #1e1e1e;
            border-color: #444;
        }

        body.dark button {
            background-color: #333;
            color: #fff;
        }
    </style>
</head>

<body>

    <h1>🧹 JSON Formatter & Validator</h1>
    <label style="display: block; margin-bottom: 10px;">
        <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
        🌙 Dark Mode
    </label>
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark');
        }
    </script>
    <textarea id="jsonInput" placeholder="Paste your JSON here..."></textarea>
    <br>
    <button onclick="formatJSON()">Format & Validate</button>

    <div id="output"></div>

    <script>
        function formatJSON() {
            const input = document.getElementById('jsonInput').value;
            const output = document.getElementById('output');
            try {
                const parsed = JSON.parse(input);
                const formatted = JSON.stringify(parsed, null, 2);
                output.innerText = formatted;
                output.className = '';
            } catch (e) {
                output.innerText = '❌ Invalid JSON: ' + e.message;
                output.className = 'error';
            }
        }
    </script>

    <button onclick="copyOutput()">📋 Copy Output</button>
    <script>
        function copyOutput() {
            const text = document.getElementById('output').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }
    </script>
</body>

</html>
